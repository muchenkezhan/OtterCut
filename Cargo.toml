[package]
name = "takeseam"
version = "0.1.0"
edition = "2024"
description = "OtterCut desktop recording and editing"
license = "Apache-2.0"
default-run = "ottercut"

[[bin]]
name = "ottercut"
path = "src/bin/takeseam-desktop.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.17.3"
ctrlc = "3.5"
eframe = { version = "0.34.1", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
fast_image_resize = "6.1"
raw-window-handle = "0.6.2"
rfd = "0.15.4"
serde_json = "1"
tempfile = "3"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-capture = "2.0.1"
